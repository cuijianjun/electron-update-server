services:
  updates:
    build: .
    user: "${UPDATE_UID:?set publisher uid}:${UPDATE_GID:?set publisher gid}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:25565:25565"
    environment:
      HOST: 0.0.0.0
      UPDATE_SERVER_CONFIG: /config/config.json
      UPDATE_DATA_DIR: /data
    volumes:
      - ${UPDATE_CONFIG_FILE:?set public config file}:/config/config.json:ro
      - ${UPDATE_DATA_DIR:?set data directory}:/data:ro
